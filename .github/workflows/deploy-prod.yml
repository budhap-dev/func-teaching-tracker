name: Deploy to Production (manual)

# Production is gated behind a manual trigger (run from the Actions tab or via
# `gh workflow run deploy-prod.yml`). This is the free-plan alternative to a
# GitHub Environment required-reviewer rule. It builds fresh and deploys to the
# prod Function App.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          include-hidden-files: true # keep .funcignore
          path: |
            dist
            node_modules
            host.json
            package.json
            package-lock.json
            .funcignore

  prod:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
