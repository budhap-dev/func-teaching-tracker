name: Deploy
# One workflow, both environments. Push auto-deploys dev; prod is a manual
# promotion (Actions → Run workflow). No waiting/polling job, so nothing logs
# or burns minutes while a manual approval is pending — promote whenever.
run-name: "Deploy: ${{ github.event.head_commit.message || github.sha }} (@${{ github.actor }})"

on:
  push:
    branches: [main]
  workflow_dispatch: # = promote this commit to prod

# id-token: OIDC deploy login · contents: checkout.
permissions:
  id-token: write
  contents: read

jobs:
  # Build once; the same artifact is deployed to dev (push) or prod (dispatch).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      # Ship only production dependencies in the deployment package.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          include-hidden-files: true # keep .funcignore
          path: |
            dist
            node_modules
            host.json
            package.json
            package-lock.json
            .funcignore

  # Auto — every push to main deploys to dev. Skipped (greyed) on a manual run.
  dev:
    if: ${{ github.event_name == 'push' }}
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev

  # Manual — promote to prod by running this workflow (Actions → Run workflow).
  # Skipped (greyed) on push runs, so it's clearly the gated stage without any
  # job sitting and polling for approval.
  prod:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
