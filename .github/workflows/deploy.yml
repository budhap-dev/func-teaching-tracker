name: Deploy
# One pipeline for both environments: build → dev (auto) → approval → prod.
# The run graph shows all stages together, so it's clear what is going where.
run-name: "Deploy ${{ github.sha }} → dev, then prod on approval"

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: OIDC deploy login · contents: checkout · issues: the approval gate
# opens/closes its approval issue.
permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  # Build once; the same artifact is deployed to dev and then prod.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      # Ship only production dependencies in the deployment package.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          include-hidden-files: true # keep .funcignore
          path: |
            dist
            node_modules
            host.json
            package.json
            package-lock.json
            .funcignore

  # Stage 1 — every push auto-deploys to dev.
  dev:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev

  # Manual gate — pauses the run until an approver comments on the auto-opened
  # issue. The free-plan stand-in for a GitHub Environment required-reviewer
  # rule; prod stays greyed/pending until this passes.
  approve-prod:
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Await production approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: budhap-dev
          minimum-approvals: 1
          issue-title: "Deploy ${{ github.sha }} to production?"
          issue-body: >
            This commit is live on **dev**. Comment `approved` to promote it to
            **prod**, or `denied` to stop. Auto-fails after 60 minutes.

  # Stage 2 — deploy the same artifact to prod once approved.
  prod:
    needs: approve-prod
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
