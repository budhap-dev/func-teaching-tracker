name: Build & Deploy to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC login needs id-token: write; contents: read for checkout.
permissions:
  id-token: write
  contents: read

jobs:
  # Build once, then deploy that artifact to dev.
  # Production is deployed separately and manually via deploy-prod.yml.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      # Ship only production dependencies in the deployment package.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          include-hidden-files: true # keep .funcignore
          path: |
            dist
            node_modules
            host.json
            package.json
            package-lock.json
            .funcignore

  dev:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
