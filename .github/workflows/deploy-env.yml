name: Deploy to environment

# Reusable workflow: deploys the prebuilt artifact to one environment.
# The GitHub Environment (dev/prod) supplies the AZURE_* variables and any
# protection rules (e.g. required reviewers on prod). The OIDC token subject
# becomes `repo:<owner>/<repo>:environment:<name>`, matching the federated
# credential Terraform created for that environment.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod).
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (${{ inputs.environment }})
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: '.'
          respect-funcignore: true
          remote-build: false

      # The run's Summary answers "what went where" without opening logs.
      - name: Record what this environment now runs
        run: |
          {
            echo "## ✅ ${{ inputs.environment }} now runs \`${{ github.sha }}\`"
            echo ""
            echo "| Commit | Deployed (UTC) |"
            echo "|---|---|"
            echo "| \`${{ github.sha }}\` | $(date -u +'%F %T') |"
            echo ""
            echo "Both environments at a glance: Actions → **Environment status**."
          } >> "$GITHUB_STEP_SUMMARY"
